version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: outa-postgres
    environment:
      POSTGRES_USER: outa
      POSTGRES_PASSWORD: outa_password
      POSTGRES_DB: outa_erp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outa"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: outa-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Authentication Service
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: outa-auth-service
    environment:
      - SECRET_KEY=your-super-secret-key-change-in-production
      - DATABASE_URL=postgresql://outa:outa_password@postgres:5432/outa_erp
      - REDIS_URL=redis://redis:6379
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/auth-service:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload

  # Finance Service
  finance-service:
    build:
      context: ./services/finance-service
      dockerfile: Dockerfile
    container_name: outa-finance-service
    environment:
      - DATABASE_URL=postgresql://outa:outa_password@postgres:5432/outa_erp
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/finance-service:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8002 --reload

  # Frontend (React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: outa-frontend
    ports:
      - "3000:3000"
    depends_on:
      - auth-service
      - finance-service
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost

volumes:
  postgres_data:
